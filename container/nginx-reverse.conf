# Midori Marketplace — vhost de borde (placeholder: marketplace.example.com).
# Escucha solo :80; certbot añade :443 y las directivas ssl.
#
# ANTES de instalar: correr
#   grep -l "limit_req_status" /etc/nginx/vhosts.d/*.conf
# Si ya hay un vhost que lo declara (todos los vhosts.d/*.conf se
# concatenan en el mismo bloque http), NO repetirlo aquí — nginx -t falla
# con "directive is duplicate" (ya pasó con ads.conf/midori-sync.conf).
#
# Instalar en /etc/nginx/vhosts.d/marketplace.conf, luego:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d marketplace.astian.org --non-interactive --agree-tos -m <email>
# (la renovación la gestiona certbot-renew.timer, ya activo).
#
# El contenedor publica la app en 127.0.0.1:2005 (ver container/setup.sh,
# confirmar el puerto real al desplegar). No se expone directo a
# Internet, solo este borde lo alcanza.

limit_req_zone  $binary_remote_addr zone=marketplace_public:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=marketplace_api:10m    rate=50r/s;
limit_req_zone  $binary_remote_addr zone=marketplace_auth:10m   rate=5r/s;
limit_conn_zone $binary_remote_addr zone=marketplace_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name marketplace.example.com;

    server_tokens off;
    access_log /var/log/nginx/marketplace.access.log;
    error_log  /var/log/nginx/marketplace.error.log;

    # Subida de extensiones (.zip, hasta 10 MB por archivo interno más
    # margen de empaquetado).
    client_max_body_size 15m;
    limit_conn marketplace_conn 100;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Defensa en profundidad (el nginx interno también bloquea esto).
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:bak|conf|dist|dump|env|ini|log|orig|save|sh|sql|swp|tar)$ { deny all; }
    location ~ ~$ { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Única entrada confiable: se SOBRESCRIBE cualquier X-Forwarded-For del
    # cliente (evita spoofing de IP).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_redirect off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Autenticación (Authentik OIDC): límite agresivo (anti-fuerza bruta).
    location ~* ^/auth/ {
        limit_req zone=marketplace_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:2005;
    }

    location ^~ /api/ {
        limit_req zone=marketplace_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:2005;
    }

    location / {
        limit_req zone=marketplace_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:2005;
    }
}
