[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
umask=022

[program:php-fpm]
command=php-fpm85 -F
priority=10
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ScanExtensionJob (escaneo de extensiones subidas) se despacha vía cola
; database por defecto; necesita al menos un worker arriba.
[program:queue-worker]
command=/usr/local/bin/marketplace-queue-worker
directory=/var/www/html
user=nginx
priority=30
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=100
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Sin programa "scheduler" a propósito: routes/console.php no define
; ningún Schedule::, y "artisan schedule:work" necesita proc_open para
; lanzar cada comando programado como proceso aparte (aunque el comando
; en sí sea PHP puro, sin shell) — proc_open está en disable_functions
; (shell-less). Corrido sin nada que ejecutar, solo crasheaba cada
; minuto por esto, sin aportar nada.
;
; Si en el futuro se agrega un Schedule:: real, la opción que NO requiere
; tocar disable_functions es un timer systemd --user en el HOST (como
; el de backup.sh) que haga
; "podman exec <servicio> php artisan schedule:run" una vez por minuto.
